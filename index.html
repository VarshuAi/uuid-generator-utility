<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID Generator Utility — Glassmorphism Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-emoji">🆔</span>
                <div class="title-col">
                    <h1>UUID Generator Utility</h1>
                    <p class="tagline">Bulk Cryptographic UUID v4 generator with clear export configs.</p>
                </div>
            </div>
            <div class="badge">utilities</div>
        </header>

        <main class="workspace-card">
            
            <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 16px;">
                <label>Count to Generate:</label>
                <input type="number" id="uuid-count" value="5" min="1" max="100" style="width: 80px; text-align: center;">
                <button class="btn" id="btn-uuid-gen">Generate</button>
            </div>
            <textarea id="uuid-box" readonly style="width: 100%; height: 200px;"></textarea>
        
        </main>
        
        <footer class="app-footer">
            <p>Created as a premium portfolio piece by <a href="https://github.com/VARSHAN69" target="_blank">@VARSHAN69</a></p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
